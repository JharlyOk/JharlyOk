name: Build Profile Assets

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'themes/**'
      - 'scripts/**'
      - 'README.template.md'
  workflow_dispatch:
  schedule:
    # Rebuild every 6 hours to keep live GitHub metrics & visitors up to date
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile SVG assets & sync README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit & push assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md .cache/telemetry.json
          git diff --staged --quiet || git commit -m "chore(telemetry): update dynamic metrics & badges [skip ci]"
          git push
