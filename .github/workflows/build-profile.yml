name: Build Profile Assets

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'themes/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    # Rebuild daily at 06:00 UTC (for future activity card with live data)
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile SVG assets
        run: python scripts/build.py

      - name: Commit & push assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "build: recompile profile assets [skip ci]"
          git push
