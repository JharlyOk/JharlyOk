      animation-delay: 9.0s;
    }
    .msg-4 {
      opacity: 0;
      animation: cycle 15.0s ease-in-out infinite;
      animation-delay: 12.0s;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1.1s step-end infinite;
    }
  </style>
