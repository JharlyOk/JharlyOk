      19.0%, 100% { opacity: 0; }
    }
    .msg-0 {
      opacity: 0;
      animation: cycle 15.0s ease-in-out infinite;
      animation-delay: 0.0s;
    }
    .msg-1 {
      opacity: 0;
      animation: cycle 15.0s ease-in-out infinite;
      animation-delay: 3.0s;
