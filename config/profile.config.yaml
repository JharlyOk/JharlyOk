# yaml-language-server: $schema=./schema.json
# ==============================================================================
# 🚀 PERFIL DE GITHUB — FUENTE ÚNICA DE LA VERDAD (JharlyOk)
# ==============================================================================
# Este es el ÚNICO archivo que necesitas editar para personalizar tu perfil.
# Toda modificación aquí sincroniza automáticamente las tarjetas SVG y el README.
#
# Para compilar localmente:
#   python scripts/build.py
# ==============================================================================

# ==============================================================================
# 🎛️ 1. MÓDULOS ACTIVOS (Feature Toggles)
# Define qué secciones se compilan y aparecen en tu README (true = activo, false = oculto)
# ==============================================================================
modules:
  header: true       # Saludo máquina de escribir animado + 4 highlight cards + telemetría
  banner: true       # Editor de código Neovim / VS Code con tu config
  projects: true     # Árbol de terminal con tus proyectos y repositorios
  stack: true        # Cuadrícula categorizada con tus tecnologías y herramientas
  stats: true        # Dashboard grande (880px) de métricas de GitHub y telemetría
  connect: true      # Terminal completa (880px) de canales de comunicación, SLAs y tags
  badges: true       # Botones vectoriales split-pill de redes sociales (100% interactivos)
  telemetry: true    # Badges sueltos de métricas (followers, repos, stars, visitas) al pie

# ==============================================================================
# 👤 2. IDENTIDAD Y BIENVENIDA (header.py)
# ==============================================================================
identity:
  handle: "JharlyOk"
  role: "AI-Assisted Systems Builder & Bot Architect"
  tagline: "Transforming complex distributed ideas into production software through AI acceleration"

  # 4 tarjetas destacadas del header con punto de estado verde
  # Íconos disponibles: bot, audio, ai, infra (o cualquier archivo de scripts/engine/svg/icons/)
  highlights:
    - icon: bot
      label: "13+ Production Bots"
      detail: "Telegram & Discord fleet"

    - icon: audio
      label: "Real-Time Audio"
      detail: "Lavalink v4 + LavaSrc pipeline"

    - icon: ai
      label: "Multi-LLM Development"
      detail: "Gemini, Claude, Cursor, LLM Arena"

    - icon: infra
      label: "Self-Hosted Infra"
      detail: "Docker + Linux VPS + Pterodactyl"

  # Frases que se escriben solas en la terminal superior (animación SMIL nativa en bucle)
  welcome_messages:
    - "Hey, welcome to my workspace"
    - "Building autonomous bot ecosystems"
    - "13+ production bots running 24/7"
    - "AI-accelerated dev with Gemini & Claude"
    - "Real-time audio routing with Lavalink v4"

  # 📊 Telemetría en vivo integrada al pie del header SVG (control granular)
  telemetry:
    enabled: false              # true = dibuja una 3ra fila de métricas dentro del Header SVG
    metrics:
      followers: true          # 👥 1 Followers (red de desarrolladores)
      repos: true              # 📦 8 Repos (código público activo)
      stars: true             # ⭐ Oculta las estrellas (ideal mientras tengas 0)
      views: true              # 👁️ 73+ Views (contador de visitas en vivo)

# ==============================================================================
# 🎨 3. TEMAS DE COLOR (themes/github-dark.json & github-light.json)
# ==============================================================================
themes:
  dark: "github-dark"
  light: "github-light"

# ==============================================================================
# 💻 4. EDITOR DE CÓDIGO NEOVIM (banner.py)
# Simula una sesión de Neovim/VS Code mostrando tu configuración en TypeScript
# ==============================================================================
banner:
  filename: "JharlyOk.config.ts"
  filepath: "src/core/"
  language: "TypeScript"
  git_branch: "main"
  code_lines:
    - tokens:
        - type: keyword
          text: "import"
        - type: punctuation
          text: " { "
        - type: type
          text: "SystemsBuilder"
        - type: punctuation
          text: " } "
        - type: keyword
          text: "from"
        - type: string
          text: ' "@epic/core"'
        - type: punctuation
          text: ";"
    - tokens: []
    - tokens:
        - type: comment
          text: "// AI-accelerated autonomous bot ecosystems"
    - tokens:
        - type: keyword
          text: "export const"
        - type: punctuation
          text: " profile"
        - type: keyword
          text: ":"
        - type: type
          text: " SystemsBuilder"
        - type: punctuation
          text: " = {"
    - tokens:
        - type: property
          text: "  handle"
        - type: punctuation
          text: ": "
        - type: string
          text: '"JharlyOk"'
        - type: punctuation
          text: ","
    - tokens:
        - type: property
          text: "  role"
        - type: punctuation
          text: ": "
        - type: string
          text: '"AI-Assisted Systems Builder"'
        - type: punctuation
          text: ","
    - tokens:
        - type: property
          text: "  focus"
        - type: punctuation
          text: ": "
        - type: string
          text: '"Autonomous Bot Ecosystems & Audio Infra"'
        - type: punctuation
          text: ","
    - tokens:
        - type: property
          text: "  stack"
        - type: punctuation
          text: ": {"
    - tokens:
        - type: property
          text: "    bots"
        - type: punctuation
          text: ": ["
        - type: string
          text: '"Telethon"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"Pyrogram"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"Discord.js v14"'
        - type: punctuation
          text: "],"
    - tokens:
        - type: property
          text: "    audio"
        - type: punctuation
          text: ": ["
        - type: string
          text: '"Lavalink v4"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"LavaSrc"'
        - type: punctuation
          text: "],"
    - tokens:
        - type: property
          text: "    ai"
        - type: punctuation
          text: ": ["
        - type: string
          text: '"Gemini"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"Claude"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"Cursor"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"LLM Arena"'
        - type: punctuation
          text: "],"
    - tokens:
        - type: property
          text: "    infra"
        - type: punctuation
          text: ": ["
        - type: string
          text: '"Docker"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"Linux VPS"'
        - type: punctuation
          text: ", "
        - type: string
          text: '"SQLite WAL"'
        - type: punctuation
          text: "],"
    - tokens:
        - type: punctuation
          text: "  },"
    - tokens:
        - type: property
          text: "  status"
        - type: punctuation
          text: ": "
        - type: string
          text: '"building"'
        - type: punctuation
          text: ","
    - tokens:
        - type: punctuation
          text: "};"
    - tokens: []

# ==============================================================================
# 📂 5. PROYECTOS DESTACADOS (projects.py)
# Árbol de terminal que muestra tus sistemas y frameworks en producción
# ==============================================================================
projects:
  - name: "epic-ai-agents"
    type: "AI Context Framework"
    description: "System prompt architecture for LLM-assisted bot development"
    tags:
      - "Two-Phase Init"
      - "Zero-Trust"
      - "Repository Pattern"

  - name: "EpicBot v4"
    type: "Discord Bot Engine"
    description: "Sharded TypeScript bot with Lavalink audio streaming"
    tags:
      - "Discord.js v14"
      - "Redis"
      - "Lavalink v4"

  - name: "Epic Telegram Suite"
    type: "Autonomous Bot Fleet"
    description: "13+ specialized content automation bots"
    tags:
      - "Telethon"
      - "Pyrogram"
      - "Gemini AI"
      - "SQLite WAL"

# ==============================================================================
# 🛠️ 6. MATRIZ DE STACK Y TECNOLOGÍAS (stack_matrix.py)
# Categorías y badges en cuadrícula terminal
# ==============================================================================
stack:
  ai_toolchain:
    label: "AI & LLM Toolkit"
    items:
      - "Google Gemini"
      - "Claude"
      - "Cursor"
      - "LLM Arena"
      - "epic-ai-agents"

  bot_frameworks:
    label: "Bot Frameworks (MTProto)"
    items:
      - "Telethon"
      - "Pyrogram"
      - "Discord.js v14"

  audio_media:
    label: "Audio & Media Pipeline"
    items:
      - "Lavalink v4"
      - "LavaSrc"
      - "Pillow"

  data:
    label: "Persistence & Caching"
    items:
      - "SQLite (WAL)"
      - "Redis"
      - "MongoDB"

  runtime:
    label: "Core Runtimes"
    items:
      - "Python 3.12"
      - "TypeScript 5"
      - "Node.js 20"

  infra:
    label: "Infrastructure"
    items:
      - "Docker"
      - "Linux VPS"
      - "Pterodactyl"

